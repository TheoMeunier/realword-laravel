services:
 # App Service
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: ${APP_SLUG}_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_NAME: ":80"
    networks:
      - app_network

  # Postgres Service
  database:
    image: postgres:17-alpine
    container_name: ${APP_SLUG}_database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./storage-db:/var/lib/postgresql/data
    networks:
      - app_network

# Docker Networks
networks:
  app_network:
    driver: bridge
